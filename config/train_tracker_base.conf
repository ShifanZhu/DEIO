expname = tracker_base

# dataset
datapath = /media/s/rell/tartan

# options
evs = True
eval = True
eval_seqs = 10
ddp = False
amp = True
num_workers = 8

# checkpoints
resume =
fgraph_pickle = fgraph/TartanAirEVS.pickle
train_split = script/splits/tartan/tartan_default_train.txt
val_split = script/splits/tartan/tartan_default_val.txt

# preprocessing / augmentation
patches_per_image = 80
patch_selector = "scorer"
norm = "std2"
randaug = True

# training options
batch = 1
iters = 18 # full 18
steps = 200000 # full 240000
save_freq = 5000 # full 10000
lr = 0.00008
clip = 10.0
n_frames = 15
scale = 1.0

# loss
flow_weight = 1.0
scores_weight = 0.05
gamma = 0.8
score_objective = baseline
score_rank_tau_e = 1.0
score_rank_margin = 0.2
score_entropy_weight = 0.1
score_tv_weight = 0.01
score_rank_top_quantile = 0.25
score_rank_bottom_quantile = 0.25
score_repeatability_weight = 1.0
score_repeatability_dropout = 0.15
score_repeatability_bin_shift = 1
score_diversity_weight = 0.25
score_diversity_min_separation = 0.06
score_teacher_weight = 0.5
score_teacher_warmup_frac = 0.2
score_aux_head_weight = 1.0
score_cycle_horizon = 5
score_replay_steps = 6 # full 10
score_replay_runs = 2 # full 3
score_cycle_tau_fb = 0.5
score_cycle_tau_rep = 1.0
eval_viz_seqs = 3
eval_viz_frames = 3

# network
dim_inet = 384
dim_fnet = 128
dim = 32
