### FMNet Training Config ###
# Feature-Metric Event Odometry
# Launch: python train_fm.py -c config/fmnet_base.conf --data_path /path/to/data

# ---- Experiment ----
name = fmnet_base
checkpoint =

# ---- Data ----
# data_path must be set on command line or overridden in a derived config
data_path = /media/s/SF_backup/deep_event_odometry/cear/indoor/
n_keyframes      = 4
interval_frames  = 5
sub_frame_stride = 1
bins             = 5
d_max            = 100.0
depth_k          = 1.0

# ---- Network ----
dim_fnet          = 64       # full: 128
dim_inet          = 128      # full: 384
dim               = 16       # full: 32
patches_per_image = 80       # full: 80
norm              = std2
randaug           = False    # full: True

# ---- Training ----
batch     = 1
steps     = 100000            # full: 100000
iters     = 12                # full: 12
gn_iters  = 4                # full: 4
lr        = 0.00008
clip      = 10.0

# ---- Loss ----
pose_weight = 10.0
feat_weight = 0.1
accum_steps = 1

# ---- Multi-GPU ----
# ddp     = True
# gpu_num = 2
# port    = 12349
