expweek = 2023-mm-dd
expname = DEVO_base

# dataset
datapath = /media/s/HDD8/data/tartan

# options
evs = True
eval = True
ddp = False
profiler = False
amp = True
num_workers = 8

# checkpoints
checkpoint =
fgraph_pickle = fgraph/TartanAirEVS.pickle
train_split = script/splits/tartan/tartan_train_test.txt
val_split = script/splits/tartan/tartan_val_test.txt

# preprocessing / augmentation
# TODO: introduce options
patches_per_image = 80
patch_selector = "scorer"
norm = "std2"
randaug = True

# training options
batch = 1
iters = 6 # full 18
steps = 10000 # full 240000
save_freq = 1000 # full 10000
lr = 0.00008
clip = 10
n_frames = 8 # full 15

# loss
pose_weight = 10.0
flow_weight = 0.1
scores_weight = 0.05