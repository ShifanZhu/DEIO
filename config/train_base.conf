expweek = 2023-mm-dd
expname = DEVO_base

# dataset
datapath = /media/s/rell/tartan

# options
evs = True
eval = True
ddp = False
profiler = False
amp = True
num_workers = 8

# checkpoints
resume =
fgraph_pickle = fgraph/TartanAirEVS.pickle
train_split = script/splits/tartan/tartan_default_train.txt
