### DEVO Config File ###

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 96
REMOVAL_WINDOW: 22
OPTIMIZATION_WINDOW: 10
PATCH_LIFETIME: 13

# threshold for keyframe removal
KEYFRAME_THRESH: 5.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# maybe use mixed precision for inference
MIXED_PRECISION: True

# Select between random, gradient, scorer
PATCH_SELECTOR: 'scorer'
# Normalizer (only evs): none, rescale, standard (std)
NORM: 'std'
# Eval mode of patch selector (3xrandom, topk, multinomial)
SCORER_EVAL_MODE: 'multi'
SCORER_EVAL_USE_GRID: True
ENABLE_DBA_TRACK_FILTERS: True
ENABLE_EVENT_SUPPORT_FILTER: True
MIN_EVENT_SUPPORT: 4.0
MIN_EVENT_PIXELS: 4.0
ENABLE_RANSAC_FILTER: True
RANSAC_REPROJ_THRESH: 0.003
RANSAC_CONFIDENCE: 0.99
RANSAC_MIN_POINTS: 8
RANSAC_MIN_INLIERS: 8

# For proximity loop closure 
LOOP_CLOSURE: True # False #是否采用GBA
BACKEND_THRESH: 64.0
MAX_EDGE_AGE: 1000
GLOBAL_OPT_FREQ: 15 #每15帧进行一次全局优化

# For IMU integration
ENALBE_IMU: True #采用IMU
Ti1c: [0.9999711474430529,    0.0013817010649267755, -0.007469617365767657, 0.00018050225881571712,      
      -0.0014085305353606873, 0.9999925720306121,    -0.00358774655345255, -0.004316353415695194,
       0.007464604688444933,  0.0035981642219379494,  0.9999656658561218,  -0.027547385763471585,
       0.0,                   0.0,                    0.0,                  1.0]
ENALBE_INV: True #若传入的为T_cam_imu，则设为True,做逆变换
accel_noise_sigma: 0.16
gyro_noise_sigma: 0.05
accel_bias_sigma: 0.003
gyro_bias_sigma: 4.0e-5
